spring:
  application:
    name: arcus-http

server:
  port: ${ARCUS_HTTP_PORT:49686}

arcus:
  zookeeper-address: ${ARCUS_ZOOKEEPER_ADDRESS:localhost:2181}
  service-code: ${ARCUS_SERVICE_CODE:test}
  pool-size: ${ARCUS_POOL_SIZE:8}
  operation-timeout-ms: ${ARCUS_OPERATION_TIMEOUT_MS:700}

springdoc:
  default-produces-media-type: application/json

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
